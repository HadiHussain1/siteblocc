<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stripe Setup Complete | Dinebloc</title>
<link rel="icon" href="{{ url_for('uploads', filename='logo.webp') }}" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

.card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 3rem 2.5rem;
  max-width: 440px;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}

.icon {
  width: 56px;
  height: 56px;
  background: #dcfce7;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  font-size: 1.6rem;
}

h1 {
  font-size: 1.4rem;
  font-weight: 700;
  color: #0f172a;
  margin: 0 0 0.5rem;
}

p {
  font-size: 0.9rem;
  color: #64748b;
  margin: 0 0 2rem;
  line-height: 1.6;
}

.btn {
  display: inline-block;
  background: #2563eb;
  color: #fff;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 0.65rem 1.5rem;
  border-radius: 8px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: background 0.15s;
}
.btn:hover { background: #1d4ed8; }
</style>
</head>
<body>

<div class="card">
  <div class="icon">&#10003;</div>
  <h1>Stripe Setup Complete</h1>
  <p>Your Stripe account has been connected. Return to your dashboard — your project settings will reflect the updated payment status.</p>
  <a class="btn" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</div>

</body>
</html>
