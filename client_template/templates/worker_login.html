<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Worker Login</title>
<link rel="stylesheet" href="{{ url_for('client_static', filename='css/' + (theme_css_file | default('main.css'))) }}">
{% include "_favicon_links.html" %}
<style>
  body { background: #0f0f0f; color: #f5f5f5; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
  form { background: #161616; padding: 2rem; border-radius: 8px; display: flex; flex-direction: column; gap: 1rem; width: 300px; }
  input { padding: 0.5rem; border-radius: 8px; border: none; }
  button { padding: 0.5rem; border-radius: 8px; border: none; background: #d4a373; color: #000; cursor: pointer; font-weight: 600; }
  button:hover { background: #e0b98b; }
  .error { color: #f55; font-size: 0.9rem; }
</style>
</head>
<body>
<form method="POST">
  <h2>Worker Login</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form>
</body>
</html>
