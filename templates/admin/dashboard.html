<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Panel</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    background: #0f1115;
    color: #e6e6e6;
}

.container {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 220px;
    background: #151821;
    border-right: 1px solid #2a2f3a;
    padding: 20px;
}

.nav-item {
    padding: 10px;
    cursor: pointer;
}

.main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.card {
    background: #151821;
    border: 1px solid #2a2f3a;
    padding: 15px;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    padding: 6px;
    border-bottom: 1px solid #2a2f3a;
}

input {
    background: #0f1115;
    border: 1px solid #2a2f3a;
    color: white;
    padding: 4px;
}

button {
    background: #2a2f3a;
    border: none;
    color: white;
    padding: 5px 8px;
    cursor: pointer;
    margin-right: 5px;
}

button:hover {
    background: #3a4150;
}

.btn-danger {
    background: #8b2c2c;
}

.pagination {
    margin-top: 10px;
}

.log-box {
    background: black;
    height: 150px;
    overflow-y: auto;
    font-size: 11px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
    <div class="nav-item">Database</div>
    <div class="nav-item">Logs</div>
</div>

<div class="main">

<div class="card">
    <h3>Database</h3>

    <select id="tableSelect"></select>
    <button onclick="addRow()">+ Add Row</button>

    <table id="dbTable">
        <thead></thead>
        <tbody></tbody>
    </table>

    <div class="pagination">
        <button onclick="prevPage()">Prev</button>
        <span id="pageInfo"></span>
        <button onclick="nextPage()">Next</button>
    </div>
</div>

<div class="card">
    <h3>Logs</h3>
    <div id="logs" class="log-box"></div>
</div>

</div>
</div>

<script>
let currentTable = "";
let currentPage = 1;
let pageSize = 20;
let currentPK = "id";

function log(msg) {
    const logs = document.getElementById("logs");
    logs.innerHTML += msg + "<br>";
    logs.scrollTop = logs.scrollHeight;
}

async function loadTables() {
    const res = await fetch('/admin-api/tables');
    const data = await res.json();

    const select = document.getElementById("tableSelect");
    select.innerHTML = "";

    data.tables.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
    });

    currentTable = select.value;
    loadTable();
}

async function loadTable() {
    log("Loading table: " + currentTable);

    const res = await fetch(`/admin-api/table/${currentTable}/paged?page=${currentPage}&limit=${pageSize}`);
    const data = await res.json();

    renderTable(data.rows);
    renderPagination(data.total);
}

function renderTable(rows) {
    const thead = document.querySelector("#dbTable thead");
    const tbody = document.querySelector("#dbTable tbody");

    thead.innerHTML = "";
    tbody.innerHTML = "";

    if (!rows.length) return;

    const keys = Object.keys(rows[0]);
    currentPK = keys.includes("id") ? "id" : keys[0];

    let header = "<tr>";
    keys.forEach(k => header += `<th>${k}</th>`);
    header += "<th>Actions</th></tr>";
    thead.innerHTML = header;

    rows.forEach(row => {
        let tr = "<tr>";

        keys.forEach(k => {

            if (k === currentPK) {
                tr += `<td>${row[k]}</td>`;
            } else {
                tr += `<td contenteditable="true"
                           data-key="${k}"
                           data-id="${row[currentPK]}"
                           onblur="autoSave(this)">
                           ${row[k] ?? ""}
                       </td>`;
            }

        });

        tr += `<td>
            <button class="btn-danger" onclick="deleteRow(${row[currentPK]})">Delete</button>
        </td>`;

        tr += "</tr>";
        tbody.innerHTML += tr;
    });
}

function renderPagination(total) {
    const totalPages = Math.ceil(total / pageSize);
    document.getElementById("pageInfo").innerText =
        `Page ${currentPage} / ${totalPages}`;
}

function nextPage() {
    currentPage++;
    loadTable();
}

function prevPage() {
    if (currentPage > 1) currentPage--;
    loadTable();
}

async function deleteRow(id) {
    if (!confirm("Delete row?")) return;

    await fetch(`/admin-api/delete/${currentTable}/${id}`, { method: "POST" });

    log("Deleted row " + id);
    loadTable();
}


async function addRow() {
    const res = await fetch(`/admin-api/add/${currentTable}`, { method: "POST" });
    const data = await res.json();

    if (data.error) {
        log("ERROR: " + data.error);
        return;
    }

    log("Added new row");
    loadTable();
}

async function loadLogs() {
    const res = await fetch('/admin-api/logs');
    const data = await res.json();

    data.logs.forEach(l => {
        log(`[${l.visited_at}] ${l.ip_address} → ${l.path}`);
    });
}

document.getElementById("tableSelect").addEventListener("change", e => {
    currentTable = e.target.value;
    currentPage = 1;
    loadTable();
});

window.onload = () => {
    loadTables();
    loadLogs();
};

async function autoSave(cell) {
    const id = cell.dataset.id;
    const key = cell.dataset.key;
    const value = cell.innerText;

    let payload = {};
    payload[key] = value;

    try {
        const res = await fetch(`/admin-api/update/${currentTable}/${id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
            alert("Saved");
            log(`Updated ${key} for row ${id}`);
        } else {
            alert("Error: " + data.error);
        }

    } catch (err) {
        alert("Request failed");
    }
}
</script>

</body>
</html>
