<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay In Store | {{ project_name }}</title>

<link rel="stylesheet" href="{{ url_for('client_static', filename='css/main.css') }}">
{% include "_favicon_links.html" %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: {{ primary }};
  --accent: {{ accent }};
  --secondary: {{ secondary }};
  --accent-hover: {{ accent_hover }};
  --accent-contrast: {{ contrast }};
  --text: {{ contrast }};
  --text-muted: color-mix(in srgb, {{ contrast }} 70%, transparent 30%);
}
</style>
</head>
<body class="checkout-instore">

<section class="checkout-page">
  <div class="checkout-layout">

    <!-- Form -->
    <form class="checkout-form" onsubmit="submitInstore(event)">
      <div class="checkout-title">Pay In-Store</div>

      <input id="name" name="name" placeholder="First Name" required>
      <input id="surname" name="surname" placeholder="Surname" required>
      <input id="phone" name="phone" type="tel" placeholder="Phone Number" required>
      <input id="email" name="email" type="email" placeholder="Email Address">
      <label class="checkout-note-field" for="note">
        <span>Any Notes?</span>
        <textarea id="note" name="note" rows="4" placeholder="Add pickup notes, preferences, or anything the team should know."></textarea>
      </label>

      <button type="submit" class="checkout-btn">Confirm & Pay In Store</button>
    </form>

    <!-- Order Summary -->
    <div class="checkout-summary">
      <h3>Order Summary</h3>
      <div id="order-summary"></div>
      <div class="total-row">
        <span>Total</span>
        <strong id="total">$0.00</strong>
      </div>
    </div>

  </div>
</section>

<div id="success" class="success"></div>

<script>
let orderData = null;

document.addEventListener("DOMContentLoaded", () => {
  orderData = JSON.parse(localStorage.getItem("checkout_order"));
  if (!orderData) return;

  const container = document.getElementById("order-summary");
  container.innerHTML = "";

  orderData.items.forEach(item => {
    const div = document.createElement("div");
    const itemLabel = item.rank
      ? `${item.title || item.name} (${item.rank})`
      : `${item.title || item.name}`;
    div.textContent = `${itemLabel} x${item.quantity || 1}`;
    container.appendChild(div);
  });

  document.getElementById("total").textContent = "$" + orderData.total.toFixed(2);
});

async function submitInstore(event) {
  event.preventDefault();

  const name = document.getElementById("name").value;
  const surname = document.getElementById("surname").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const note = document.getElementById("note").value;

  if (!name || !surname || !phone) {
    alert("Please fill all details");
    return;
  }

  const finalOrder = {
    items: orderData.items,
    total: orderData.total,
    payment: "in-store",
    name,
    surname,
    phone,
    email,
    note
  };

  const res = await fetch(`/add_order?project=${window.PROJECT_SLUG}`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(finalOrder)
  });

  const data = await res.json();

  if (data.success) {
    localStorage.clear();
    document.querySelector(".checkout-layout").innerHTML = `
      <div class="checkout-form">
        <h2>Your Order Number is ${data.order_number}</h2>
        <p>See you soon!</p>
        <button class="checkout-btn" onclick="goHome()">Back to Home</button>
      </div>
    `;
  }
}

function goHome() {
  window.location.href = `/?project=${window.PROJECT_SLUG}`;
}
</script>

<script>
  window.PROJECT_SLUG = "{{ PROJECT_SLUG }}";
</script>

</body>
</html>
