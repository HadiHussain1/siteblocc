<!DOCTYPE html>
<html>

<head>

  <link rel="stylesheet" href="{{ url_for('client_static', filename='css/main.css') }}">
  {% include "_favicon_links.html" %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <title>Order Received</title>


<style>
:root {
  --bg: {{ primary }};
  --accent: {{ accent }};
  --secondary: {{ secondary }};
  --accent-hover: {{ accent_hover }};
  --accent-contrast: {{ contrast }};

  --text: {{ contrast }};
  --text-muted: color-mix(in srgb, {{ contrast }} 70%, transparent 30%);
}
</style>

</head>

<body class="success-page">

  <div class="successBox" id="successBox">
    Loading your confirmation...
  </div>

  <script>
    window.PROJECT_SLUG = "{{ PROJECT_SLUG }}";
  </script>

  <script>
    const publicPath = (path) => path;

    function renderOrderConfirmation() {
      const confirmation = JSON.parse(sessionStorage.getItem("latest_order_confirmation") || "{}");
      if (!confirmation.order_number) {
        document.getElementById("successBox").innerHTML = `
          <div class="success-eyebrow">Order confirmation</div>
          <h1 class="success-title">Your order has been received.</h1>
          <p class="success-copy">We could not find the latest order number in this browser session.</p>
          <button onclick="goHome()">Back to Home</button>
        `;
        return;
      }

      document.getElementById("successBox").innerHTML = `
        <div class="success-eyebrow">Order confirmation</div>
        <h1 class="success-title">Your order has been received.</h1>
        <div class="success-order-number">Order Number: ${confirmation.order_number}</div>
        <p class="success-copy">The restaurant will call you shortly to confirm your order.</p>
        <p class="success-copy">Payment will be made in-store or upon pickup.</p>
        <p class="success-copy">Estimated preparation time: 15-30 minutes.</p>
        <button onclick="goHome()">Back to Home</button>
      `;
    }

    function goHome() {
      localStorage.removeItem("checkout_order");
      sessionStorage.removeItem("latest_order_confirmation");
      window.location.href = publicPath("/");
    }

    // LEGACY: Stripe payment system (disabled for trial phase)
    // async function sendOrderToDB() {
    //   const order = JSON.parse(localStorage.getItem("checkout_order"));
    //   if (!order) {
    //     document.getElementById("successBox").innerText = "No order found.";
    //     return;
    //   }
    // }

    renderOrderConfirmation();
  </script>

</body>

</html>
