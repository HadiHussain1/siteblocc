<!DOCTYPE html>
<html>

<head>

  <link rel="stylesheet" href="{{ url_for('client_static', filename='css/main.css') }}">
  {% include "_favicon_links.html" %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <title>Order Received</title>


<style>
:root {
  --bg: {{ primary }};
  --accent: {{ accent }};
  --secondary: {{ secondary }};
  --accent-hover: {{ accent_hover }};
  --accent-contrast: {{ contrast }};

  --text: {{ contrast }};
  --text-muted: color-mix(in srgb, {{ contrast }} 70%, transparent 30%);
}
</style>

</head>

<body class="success-page">

  <div class="successBox" id="successBox">
    Loading your confirmation...
  </div>

  <script>
    window.PROJECT_SLUG = "{{ PROJECT_SLUG }}";

    (function () {
      const box = document.getElementById("successBox");

      /* Prefer server-verified order_number (Stripe flow).
         Fall back to sessionStorage for offline/in-store orders. */
      const serverOrderNumber   = "{{ order_number or '' }}";
      const serverVerified      = "{{ 'true' if payment_verified else 'false' }}" === "true";
      const sessionConfirmation = JSON.parse(sessionStorage.getItem("latest_order_confirmation") || "{}");
      const orderNumber         = serverOrderNumber || sessionConfirmation.order_number || "";
      const isStripe            = serverVerified || sessionConfirmation.payment_method === "stripe";

      function goHome() {
        localStorage.removeItem("checkout_order");
        sessionStorage.removeItem("latest_order_confirmation");
        window.location.href = "/";
      }
      window.goHome = goHome;

      if (!orderNumber) {
        box.innerHTML = `
          <div class="success-eyebrow">Order confirmation</div>
          <h1 class="success-title">Your order has been placed.</h1>
          <p class="success-copy">Thank you for your order. The restaurant will be in touch shortly.</p>
          <button onclick="goHome()">Back to Home</button>
        `;
        return;
      }

      const paymentLine = isStripe
        ? `<p class="success-copy">Payment confirmed via card.</p>`
        : `<p class="success-copy">Payment will be made in-store or upon pickup.</p>`;

      box.innerHTML = `
        <div class="success-eyebrow">Order confirmed</div>
        <h1 class="success-title">Thank you for your order!</h1>
        <div class="success-order-number">Order #${orderNumber}</div>
        ${paymentLine}
        <p class="success-copy">Estimated preparation time: 15–30 minutes.</p>
        <button onclick="goHome()">Back to Home</button>
      `;
    })();
  </script>

</body>

</html>
