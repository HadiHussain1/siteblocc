<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Panel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; }

body {
    margin: 0;
    font-family: monospace;
    background: #0a0c11;
    color: #d0d4de;
}

.container {
    display: flex;
    height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
    width: 200px;
    background: #0f1219;
    border-right: 1px solid #1e2330;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
}

.sidebar-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #4a5266;
    margin-bottom: 12px;
    padding-left: 10px;
}

.nav-item {
    padding: 9px 12px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 13px;
    color: #7a849a;
    transition: background 0.15s, color 0.15s;
}

.nav-item:hover { background: #1a1f2e; color: #c0c8d8; }
.nav-item.active { background: #1e2540; color: #8fa8ff; }

/* ── Main ── */
.main {
    flex: 1;
    padding: 28px 32px;
    overflow-y: auto;
}

.section { display: none; }
.section.visible { display: block; }

/* ── Section header ── */
.section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    border-bottom: 1px solid #1e2330;
    padding-bottom: 16px;
}

.section-header h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #c0c8d8;
    letter-spacing: 0.5px;
}

.section-header .refresh-btn {
    margin-left: auto;
    padding: 6px 14px;
    font-size: 12px;
    background: #1e2540;
    border: 1px solid #2d3555;
    color: #8fa8ff;
    border-radius: 5px;
    cursor: pointer;
}

.section-header .refresh-btn:hover { background: #252e50; }

/* ── Stat cards ── */
.stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
}

.stat-card {
    background: #0f1219;
    border: 1px solid #1e2330;
    border-radius: 8px;
    padding: 16px 18px;
}

.stat-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #4a5266;
    margin-bottom: 8px;
}

.stat-card .value {
    font-size: 26px;
    font-weight: 700;
    color: #e0e6f0;
    line-height: 1;
}

.stat-card .sub {
    font-size: 11px;
    color: #4a5266;
    margin-top: 6px;
}

.stat-card.accent-blue  { border-left: 3px solid #4a7cdc; }
.stat-card.accent-green { border-left: 3px solid #3dba7a; }
.stat-card.accent-amber { border-left: 3px solid #d4913a; }
.stat-card.accent-red   { border-left: 3px solid #c0444a; }
.stat-card.accent-purple{ border-left: 3px solid #8a5fd8; }
.stat-card.accent-teal  { border-left: 3px solid #38b0a8; }

/* ── Chart rows ── */
.chart-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
}

.chart-row.triple {
    grid-template-columns: 1fr 1fr 1fr;
}

.chart-card {
    background: #0f1219;
    border: 1px solid #1e2330;
    border-radius: 8px;
    padding: 18px 20px;
}

.chart-card h4 {
    margin: 0 0 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #4a5266;
}

.chart-card canvas { width: 100% !important; }

/* ── Table in analytics ── */
.mini-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

.mini-table th {
    text-align: left;
    padding: 6px 8px;
    color: #4a5266;
    border-bottom: 1px solid #1e2330;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.mini-table td {
    padding: 7px 8px;
    border-bottom: 1px solid #141820;
    color: #9aa4b8;
}

.mini-table tr:last-child td { border-bottom: none; }

.bar-fill {
    display: inline-block;
    height: 6px;
    background: #4a7cdc;
    border-radius: 3px;
    vertical-align: middle;
    margin-left: 6px;
}

/* ── Status badges ── */
.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.badge-green  { background: #1a3327; color: #3dba7a; }
.badge-amber  { background: #2e2212; color: #d4913a; }
.badge-red    { background: #2e1214; color: #c0444a; }
.badge-blue   { background: #132040; color: #4a7cdc; }

/* ── Loading state ── */
.loading-overlay {
    text-align: center;
    padding: 60px;
    color: #4a5266;
    font-size: 13px;
}

/* ── Original DB panel styles ── */
.card {
    background: #0f1219;
    border: 1px solid #1e2330;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 20px;
}

table.db-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

table.db-table td, table.db-table th {
    padding: 6px 8px;
    border-bottom: 1px solid #1e2330;
    color: #9aa4b8;
}

table.db-table th { color: #4a5266; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

input[type="text"], input:not([type]), select {
    background: #0a0c11;
    border: 1px solid #1e2330;
    color: #c0c8d8;
    padding: 5px 8px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
}

button {
    background: #1e2330;
    border: 1px solid #2a3040;
    color: #9aa4b8;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: monospace;
    font-size: 12px;
    margin-right: 4px;
}

button:hover { background: #252e40; color: #c0c8d8; }

.btn-danger { background: #2e1214; border-color: #4a1a1c; color: #c0444a; }
.btn-danger:hover { background: #3a1618; }

.pagination { margin-top: 12px; }

.log-box {
    background: #050608;
    height: 200px;
    overflow-y: auto;
    font-size: 11px;
    padding: 12px;
    border-radius: 4px;
    border: 1px solid #1e2330;
    color: #5a6478;
    line-height: 1.7;
}

.log-box .log-entry { color: #7a8496; }
.log-box .log-ip    { color: #4a7cdc; }
.log-box .log-path  { color: #3dba7a; }
</style>
</head>

<body>

<div class="container">

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-title">System</div>
    <div class="nav-item active" onclick="showSection('analytics', this)">Analytics</div>
    <div class="nav-item" onclick="showSection('database', this)">Database</div>
    <div class="nav-item" onclick="showSection('logs', this)">Logs</div>
    <div class="nav-item" onclick="showSection('features', this)">Features</div>
</div>

<!-- Main -->
<div class="main">

<!-- ════════════════════════════════════════════════════
     ANALYTICS SECTION
════════════════════════════════════════════════════ -->
<div id="analytics" class="section visible">

    <div class="section-header">
        <h2>Analytics Overview</h2>
        <button class="refresh-btn" onclick="loadAnalytics()">↻ Refresh</button>
    </div>

    <div id="analytics-content">
        <div class="loading-overlay">Loading analytics...</div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════
     DATABASE SECTION
════════════════════════════════════════════════════ -->
<div id="database" class="section">

    <div class="section-header">
        <h2>Database</h2>
    </div>

    <div class="card">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <select id="dbTableSelect" style="min-width:200px;"></select>
            <button id="dbAddRowBtn" onclick="dbAddRow()">+ Add Row</button>
            <span id="dbError" style="color:#c0444a;font-size:12px;display:none;"></span>
        </div>

        <div style="overflow-x:auto;">
            <table class="db-table" id="dbTable">
                <thead id="dbThead"></thead>
                <tbody id="dbTbody"></tbody>
            </table>
        </div>

        <div class="pagination" style="margin-top:10px;">
            <button onclick="dbPrevPage()">Prev</button>
            <span id="dbPageInfo" style="margin:0 8px;font-size:12px;color:#8a9bb5;"></span>
            <button onclick="dbNextPage()">Next</button>
        </div>
    </div>
</div>

<!-- Edit row modal -->
<div id="dbModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;overflow-y:auto;">
    <div style="background:#1a1e2e;border:1px solid #2e3450;border-radius:8px;max-width:640px;margin:40px auto;padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="margin:0;font-size:15px;color:#c8d0e8;">Edit Row</h3>
            <button onclick="dbCloseModal()" style="background:none;border:none;color:#8a9bb5;font-size:18px;cursor:pointer;">✕</button>
        </div>
        <div id="dbModalFields" style="display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;"></div>
        <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
            <button onclick="dbCloseModal()" style="background:#2e3450;color:#8a9bb5;">Cancel</button>
            <button onclick="dbSaveModal()" style="background:#3d6b4f;color:#c8e6c9;">Save</button>
        </div>
        <div id="dbModalError" style="color:#c0444a;font-size:12px;margin-top:8px;display:none;"></div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════
     LOGS SECTION
════════════════════════════════════════════════════ -->
<div id="logs" class="section">

    <div class="section-header">
        <h2>System Logs</h2>
        <button class="refresh-btn" onclick="loadLogs()">↻ Refresh</button>
    </div>

    <div class="card">
        <div id="logs-box" class="log-box"></div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════
     FEATURE REQUESTS SECTION
════════════════════════════════════════════════════ -->
<div id="features" class="section">

    <div class="section-header">
        <h2>Feature Requests</h2>
        <button class="refresh-btn" onclick="loadFeatures()">↻ Refresh</button>
    </div>

    <div id="features-content">
        <div class="loading-overlay">Loading feature requests...</div>
    </div>
</div>

</div><!-- /main -->
</div><!-- /container -->

<script>
// ════════════════════════════════════════
// NAV
// ════════════════════════════════════════
function showSection(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('visible');
    el.classList.add('active');

    if (id === 'database' && !DB.table) dbLoadTables();
    if (id === 'logs') loadLogs();
    if (id === 'features') loadFeatures();
}

// ════════════════════════════════════════
// ANALYTICS
// ════════════════════════════════════════
const charts = {};

function destroyChart(id) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function mkChart(id, config) {
    destroyChart(id);
    const ctx = document.getElementById(id);
    if (!ctx) return;
    charts[id] = new Chart(ctx, config);
}

const CHART_DEFAULTS = {
    color: '#d0d4de',
    grid: '#1e2330',
    line: '#4a7cdc',
    bar:  '#4a7cdc',
    green:'#3dba7a',
};

function lineConfig(labels, data, label, color) {
    color = color || CHART_DEFAULTS.line;
    return {
        type: 'line',
        data: {
            labels,
            datasets: [{
                label,
                data,
                borderColor: color,
                backgroundColor: color + '22',
                fill: true,
                tension: 0.3,
                pointRadius: 3,
                pointBackgroundColor: color,
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#4a5266', font: { size: 10 } }, grid: { color: CHART_DEFAULTS.grid } },
                y: { ticks: { color: '#4a5266', font: { size: 10 } }, grid: { color: CHART_DEFAULTS.grid }, beginAtZero: true }
            }
        }
    };
}

function barConfig(labels, data, label, color) {
    color = color || CHART_DEFAULTS.bar;
    return {
        type: 'bar',
        data: {
            labels,
            datasets: [{ label, data, backgroundColor: color + 'bb', borderRadius: 4 }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#4a5266', font: { size: 10 } }, grid: { color: CHART_DEFAULTS.grid } },
                y: { ticks: { color: '#4a5266', font: { size: 10 } }, grid: { color: CHART_DEFAULTS.grid }, beginAtZero: true }
            }
        }
    };
}

function doughnutConfig(labels, data, colors) {
    return {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
        options: {
            responsive: true,
            cutout: '65%',
            plugins: {
                legend: { position: 'right', labels: { color: '#7a849a', font: { size: 11 }, boxWidth: 12 } }
            }
        }
    };
}

function fmtNum(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'k';
    return n;
}

function fmtMoney(n) {
    return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function badge(type, text) {
    return `<span class="badge badge-${type}">${text}</span>`;
}

function buildAnalyticsHTML(d) {
    const c = d.clients, p = d.projects, v = d.visits, o = d.orders, e = d.engagement;

    const fillDays = (arr, key) => {
        if (!arr || !arr.length) return { labels: [], data: [] };
        return { labels: arr.map(r => r[key].slice(5)), data: arr.map(r => r.cnt) };
    };

    const visitTrend  = fillDays(v.trend, 'day');
    const signupTrend = fillDays(c.signups_30d, 'day');
    const loginTrend  = fillDays(c.logins_14d, 'day');
    const orderTrend  = o.trend.length ? { labels: o.trend.map(r=>r.day.slice(5)), data: o.trend.map(r=>r.cnt) } : { labels:[], data:[] };
    const revTrend    = o.trend.length ? { labels: o.trend.map(r=>r.day.slice(5)), data: o.trend.map(r=>r.rev) } : { labels:[], data:[] };

    const convRate   = p.total > 0 ? ((p.deployed / p.total)*100).toFixed(0) : 0;
    const activeRate = c.total > 0 ? ((c.active   / c.total)*100).toFixed(0) : 0;
    const complRate  = o.total > 0 ? ((o.completed / o.total)*100).toFixed(0) : 0;

    const topVisitRows = (v.top_projects || []).map(r => {
        const pct = v.total > 0 ? (r.cnt / v.total * 100).toFixed(1) : 0;
        return `<tr><td>${r.project_name || r.slug}</td><td style="text-align:right">${fmtNum(r.cnt)}</td><td><span class="bar-fill" style="width:${Math.max(4,pct)}px"></span> ${pct}%</td></tr>`;
    }).join('');

    const topOrderRows = (o.top_projects || []).map(r => {
        const pct = o.total > 0 ? (r.cnt / o.total * 100).toFixed(1) : 0;
        return `<tr><td>${r.project_name}</td><td style="text-align:right">${fmtNum(r.cnt)}</td><td><span class="bar-fill" style="width:${Math.max(4,pct)}px;background:#3dba7a"></span> ${pct}%</td></tr>`;
    }).join('');

    const nicheRows = (p.by_niche || []).map(r =>
        `<tr><td>${r.niche || 'Unspecified'}</td><td style="text-align:right">${r.cnt}</td></tr>`
    ).join('');

    const ipRows = (v.top_ips || []).map(r =>
        `<tr><td>${r.ip_address}</td><td style="text-align:right">${r.cnt}</td></tr>`
    ).join('');

    const pmRows = (o.payment_methods || []).map(r =>
        `<tr><td>${r.payment_method || 'Unknown'}</td><td style="text-align:right">${r.cnt}</td></tr>`
    ).join('');

    const statusRows = (o.statuses || []).map(r =>
        `<tr><td>${r.status || '—'}</td><td style="text-align:right">${r.cnt}</td></tr>`
    ).join('');

    const hourLabels  = (v.by_hour || []).map(r => r.hr + ':00');
    const hourData    = (v.by_hour || []).map(r => r.cnt);
    const nicheLabels = (p.by_niche || []).map(r => r.niche || 'Other');
    const nicheData   = (p.by_niche || []).map(r => r.cnt);
    const nicheColors = ['#4a7cdc','#3dba7a','#d4913a','#8a5fd8','#38b0a8','#c0444a','#e06090','#6090e0'];

    window.__analyticsPayload = { visitTrend, signupTrend, loginTrend, orderTrend, revTrend, hourLabels, hourData, nicheLabels, nicheData, nicheColors };

    return `
    <!-- ROW 1: Client stats -->
    <div class="stat-grid">
        <div class="stat-card accent-blue">
            <div class="label">Total Clients</div>
            <div class="value">${fmtNum(c.total)}</div>
            <div class="sub">+${c.new_7d} this week · +${c.new_30d} this month</div>
        </div>
        <div class="stat-card accent-green">
            <div class="label">Active Clients</div>
            <div class="value">${fmtNum(c.active)}</div>
            <div class="sub">${activeRate}% of total</div>
        </div>
        <div class="stat-card accent-red">
            <div class="label">Inactive Clients</div>
            <div class="value">${fmtNum(c.inactive)}</div>
            <div class="sub">Unverified / disabled</div>
        </div>
        <div class="stat-card accent-purple">
            <div class="label">New This Week</div>
            <div class="value">${fmtNum(c.new_7d)}</div>
            <div class="sub">${fmtNum(c.new_30d)} this month</div>
        </div>
    </div>

    <!-- ROW 2: Project + Traffic stats -->
    <div class="stat-grid">
        <div class="stat-card accent-blue">
            <div class="label">Total Projects</div>
            <div class="value">${fmtNum(p.total)}</div>
            <div class="sub">${p.deployed} deployed · ${p.not_deployed} not deployed</div>
        </div>
        <div class="stat-card accent-green">
            <div class="label">Deployed Sites</div>
            <div class="value">${fmtNum(p.deployed)}</div>
            <div class="sub">${convRate}% deployment rate</div>
        </div>
        <div class="stat-card accent-teal">
            <div class="label">Site Visits (All Time)</div>
            <div class="value">${fmtNum(v.total)}</div>
            <div class="sub">Across all projects</div>
        </div>
        <div class="stat-card accent-blue">
            <div class="label">Visits Today</div>
            <div class="value">${fmtNum(v.today)}</div>
            <div class="sub">${fmtNum(v.last_7d)} last 7 days</div>
        </div>
        <div class="stat-card accent-amber">
            <div class="label">Total Orders</div>
            <div class="value">${fmtNum(o.total)}</div>
            <div class="sub">${o.today} today · ${o.last_7d} this week</div>
        </div>
        <div class="stat-card accent-green">
            <div class="label">Total Revenue</div>
            <div class="value" style="font-size:20px">${fmtMoney(o.total_revenue)}</div>
            <div class="sub">${fmtMoney(o.revenue_30d)} last 30 days</div>
        </div>
    </div>

    <!-- ROW 3: Engagement -->
    <div class="stat-grid">
        <div class="stat-card accent-purple">
            <div class="label">Customer Questions</div>
            <div class="value">${fmtNum(e.questions)}</div>
        </div>
        <div class="stat-card accent-teal">
            <div class="label">Catering Inquiries</div>
            <div class="value">${fmtNum(e.catering)}</div>
        </div>
        <div class="stat-card accent-amber">
            <div class="label">Reservations</div>
            <div class="value">${fmtNum(e.reservations)}</div>
            <div class="sub">${e.pending_reservations} pending</div>
        </div>
        <div class="stat-card accent-blue">
            <div class="label">Completed Orders</div>
            <div class="value">${fmtNum(o.completed)}</div>
            <div class="sub">${complRate}% completion rate</div>
        </div>
        <div class="stat-card accent-green">
            <div class="label">Active Memberships</div>
            <div class="value">${fmtNum(e.active_memberships)}</div>
        </div>
        <div class="stat-card accent-teal">
            <div class="label">Connected Domains</div>
            <div class="value">${fmtNum(e.connected_domains)}</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Workers</div>
            <div class="value">${fmtNum(e.workers)}</div>
        </div>
    </div>

    <!-- ROW 4: Trend charts -->
    <div class="chart-row">
        <div class="chart-card">
            <h4>Site Visits — Last 14 Days</h4>
            <canvas id="chart-visits" height="160"></canvas>
        </div>
        <div class="chart-card">
            <h4>New Signups — Last 30 Days</h4>
            <canvas id="chart-signups" height="160"></canvas>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <h4>Client Logins — Last 14 Days</h4>
            <canvas id="chart-logins" height="160"></canvas>
        </div>
        <div class="chart-card">
            <h4>Orders — Last 14 Days</h4>
            <canvas id="chart-orders" height="160"></canvas>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <h4>Revenue — Last 14 Days</h4>
            <canvas id="chart-revenue" height="160"></canvas>
        </div>
        <div class="chart-card">
            <h4>Visits by Hour (Last 7 Days)</h4>
            <canvas id="chart-hours" height="160"></canvas>
        </div>
    </div>

async function loadAnalytics() {
    const wrap = document.getElementById('analytics-content');
    wrap.innerHTML = '<div class="loading-overlay">Loading analytics...</div>';

    try {
        const res = await fetch('/admin-api/analytics');
        const d = await res.json();

        if (d.error) {
            wrap.innerHTML = `<div class="loading-overlay" style="color:#c0444a">Error: ${d.error}</div>`;
            return;
        }

        wrap.innerHTML = buildAnalyticsHTML(d);

        // Draw charts after DOM is ready
        requestAnimationFrame(() => {
            const ap = window.__analyticsPayload;
            mkChart('chart-visits',  lineConfig(ap.visitTrend.labels,  ap.visitTrend.data,  'Visits'));
            mkChart('chart-signups', lineConfig(ap.signupTrend.labels, ap.signupTrend.data, 'Signups', '#3dba7a'));
            mkChart('chart-logins',  barConfig(ap.loginTrend.labels,   ap.loginTrend.data,  'Logins', '#8a5fd8'));
            mkChart('chart-orders',  barConfig(ap.orderTrend.labels,   ap.orderTrend.data,  'Orders'));
            mkChart('chart-revenue', lineConfig(ap.revTrend.labels,    ap.revTrend.data,    'Revenue (£)', '#d4913a'));
            mkChart('chart-hours',   barConfig(ap.hourLabels,          ap.hourData,         'Visits', '#38b0a8'));
            mkChart('chart-niche',   doughnutConfig(ap.nicheLabels,    ap.nicheData,        ap.nicheColors));
        });

    } catch (err) {
        wrap.innerHTML = `<div class="loading-overlay" style="color:#c0444a">Failed to load: ${err}</div>`;
    }
}

// ════════════════════════════════════════
// DATABASE
// ════════════════════════════════════════
// ════════════════════════════════════════
// DATABASE BROWSER
// ════════════════════════════════════════
const DB = {
    table: "",
    page: 1,
    limit: 20,
    total: 0,
    pk: "id",
    modalRowId: null,
    modalKeys: [],
};

function dbEsc(v) {
    if (v === null || v === undefined) return "";
    return String(v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function dbShowError(msg) {
    const el = document.getElementById("dbError");
    el.textContent = msg;
    el.style.display = msg ? "inline" : "none";
}

async function dbLoadTables() {
    try {
        const res  = await fetch("/admin-api/tables");
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const sel = document.getElementById("dbTableSelect");
        sel.innerHTML = "";
        (data.tables || []).forEach(t => {
            const opt = document.createElement("option");
            opt.value = t; opt.textContent = t;
            sel.appendChild(opt);
        });
        DB.table = sel.value;
        DB.page  = 1;
        dbLoadRows();
    } catch (e) {
        dbShowError("Failed to load tables: " + e.message);
    }
}

async function dbLoadRows() {
    const thead = document.getElementById("dbThead");
    const tbody = document.getElementById("dbTbody");
    thead.innerHTML = "";
    tbody.innerHTML = "";
    dbShowError("");

    if (!DB.table) return;

    try {
        const url = `/admin-api/table/${encodeURIComponent(DB.table)}/rows?page=${DB.page}&limit=${DB.limit}`;
        const res  = await fetch(url);
        const data = await res.json();

        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

        DB.total = data.total || 0;
        const rows = data.rows || [];

        // Update pagination
        const totalPages = Math.max(1, Math.ceil(DB.total / DB.limit));
        document.getElementById("dbPageInfo").textContent = `Page ${DB.page} / ${totalPages}  (${DB.total} rows)`;

        if (rows.length === 0) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 99;
            td.textContent = "No rows found.";
            td.style.cssText = "color:#8a9bb5;padding:14px;";
            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        const keys = Object.keys(rows[0]);
        // Detect PK: prefer "id", else first key
        DB.pk = keys.includes("id") ? "id" : keys[0];

        // Header
        const hrow = document.createElement("tr");
        keys.forEach(k => {
            const th = document.createElement("th");
            th.textContent = k;
            hrow.appendChild(th);
        });
        const thAct = document.createElement("th");
        thAct.textContent = "Actions";
        hrow.appendChild(thAct);
        thead.appendChild(hrow);

        // Rows — use createElement, never innerHTML +=
        rows.forEach(row => {
            const tr = document.createElement("tr");
            keys.forEach(k => {
                const td   = document.createElement("td");
                const raw  = row[k];
                const text = (raw === null || raw === undefined) ? "" : String(raw);
                td.title   = text.length > 500 ? text.slice(0, 500) + "…" : text;
                td.textContent = text.length > 120 ? text.slice(0, 120) + "…" : text;
                if (raw === null || raw === undefined) {
                    td.style.color = "#4a5266";
                    td.textContent = "NULL";
                }
                tr.appendChild(td);
            });

            // Actions cell
            const tdAct = document.createElement("td");
            tdAct.style.whiteSpace = "nowrap";

            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.style.marginRight = "4px";
            editBtn.onclick = () => dbOpenModal(row, keys);

            const delBtn = document.createElement("button");
            delBtn.textContent = "Delete";
            delBtn.className = "btn-danger";
            delBtn.onclick = () => dbDeleteRow(row[DB.pk]);

            tdAct.appendChild(editBtn);
            tdAct.appendChild(delBtn);
            tr.appendChild(tdAct);
            tbody.appendChild(tr);
        });

    } catch (e) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 99;
        td.textContent = "Error loading table: " + e.message;
        td.style.cssText = "color:#c0444a;padding:14px;";
        tr.appendChild(td);
        tbody.appendChild(tr);
        document.getElementById("dbPageInfo").textContent = "";
    }
}

function dbPrevPage() {
    if (DB.page > 1) { DB.page--; dbLoadRows(); }
}
function dbNextPage() {
    const totalPages = Math.ceil(DB.total / DB.limit);
    if (DB.page < totalPages) { DB.page++; dbLoadRows(); }
}

async function dbDeleteRow(id) {
    if (!confirm(`Delete row ${id} from ${DB.table}?`)) return;
    try {
        const res  = await fetch(`/admin-api/table/${encodeURIComponent(DB.table)}/row/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        dbLoadRows();
    } catch (e) {
        dbShowError("Delete failed: " + e.message);
    }
}

async function dbAddRow() {
    try {
        const res  = await fetch(`/admin-api/table/${encodeURIComponent(DB.table)}/row`, { method: "POST", headers: {"Content-Type":"application/json"}, body: "{}" });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        DB.page = 1;
        dbLoadRows();
    } catch (e) {
        dbShowError("Add row failed: " + e.message);
    }
}

function dbOpenModal(row, keys) {
    DB.modalRowId = row[DB.pk];
    DB.modalKeys  = keys;

    const container = document.getElementById("dbModalFields");
    container.innerHTML = "";

    keys.forEach(k => {
        const val = row[k];
        const label = document.createElement("label");
        label.style.cssText = "display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8a9bb5;";
        label.textContent = k + (k === DB.pk ? " (PK – read only)" : "");

        const isBinary = typeof val === "string" && val.startsWith("[binary ");
        if (isBinary || k === DB.pk) {
            const p = document.createElement("p");
            p.textContent = val === null || val === undefined ? "NULL" : String(val);
            p.style.cssText = "margin:0;color:#4a5266;font-size:12px;word-break:break-all;";
            label.appendChild(p);
        } else {
            const text   = (val === null || val === undefined) ? "" : String(val);
            const isLong = text.length > 120;
            const input  = isLong ? document.createElement("textarea") : document.createElement("input");
            input.dataset.key = k;
            input.value       = text;
            input.style.cssText = "background:#0d1117;border:1px solid #2e3450;border-radius:4px;padding:6px;color:#c8d0e8;font-size:12px;font-family:inherit;resize:vertical;";
            if (isLong) { input.rows = 5; }
            label.appendChild(input);
        }

        container.appendChild(label);
    });

    document.getElementById("dbModalError").style.display = "none";
    document.getElementById("dbModal").style.display = "block";
}

function dbCloseModal() {
    document.getElementById("dbModal").style.display = "none";
    DB.modalRowId = null;
}

async function dbSaveModal() {
    const container = document.getElementById("dbModalFields");
    const inputs    = container.querySelectorAll("input[data-key], textarea[data-key]");
    const payload   = {};
    inputs.forEach(el => { payload[el.dataset.key] = el.value; });

    const errEl = document.getElementById("dbModalError");
    errEl.style.display = "none";

    try {
        const res  = await fetch(
            `/admin-api/table/${encodeURIComponent(DB.table)}/row/${DB.modalRowId}`,
            { method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) }
        );
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        dbCloseModal();
        dbLoadRows();
    } catch (e) {
        errEl.textContent  = "Save failed: " + e.message;
        errEl.style.display = "block";
    }
}

document.getElementById("dbTableSelect").addEventListener("change", e => {
    DB.table = e.target.value;
    DB.page  = 1;
    dbLoadRows();
});

async function loadLogs() {
    const box = document.getElementById('logs-box');
    box.innerHTML = '';
    const res = await fetch('/admin-api/logs');
    const data = await res.json();
    data.logs.forEach(l => {
        const site = l.project_name ? `<span style="color:#d4913a">[${l.project_name}]</span> ` : '';
        box.innerHTML += `<div class="log-entry"><span style="color:#4a5266">[${l.visited_at}]</span> ${site}<span class="log-ip">${l.ip_address}</span> <span style="color:#4a5266">→</span> <span class="log-path">${l.path}</span></div>`;
    });
    box.scrollTop = box.scrollHeight;
}

        const res = await fetch('/admin-api/feature_requests');
        const rows = await res.json();

            el.innerHTML = '<div class="card" style="color:#4a5266;font-size:14px;">No feature requests yet.</div>';

        }
        const html = `
        <div class="card" style="padding:0;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="background:#12151e;color:#4a5266;text-transform:uppercase;letter-spacing:0.08em;font-size:11px;">
                <th style="padding:12px 16px;text-align:left;">#</th>
                <th style="padding:12px 16px;text-align:left;">Feature</th>
                <th style="padding:12px 16px;text-align:left;">Description</th>
                <th style="padding:12px 16px;text-align:left;">Client</th>
                <th style="padding:12px 16px;text-align:left;">Page</th>
                <th style="padding:12px 16px;text-align:left;">Date</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r, i) => `
              <tr style="border-top:1px solid #1e2330;${i % 2 === 1 ? 'background:#0d0f16;' : ''}">
                <td style="padding:12px 16px;color:#4a5266;">${r.id}</td>
                <td style="padding:12px 16px;color:#8fa8ff;font-weight:600;">${r.feature_name || '—'}</td>
                <td style="padding:12px 16px;color:#c0c8d8;max-width:280px;white-space:pre-wrap;word-break:break-word;">${r.description || '—'}</td>

                <td style="padding:12px 16px;color:#7a849a;">${r.page_context || '—'}</td>

        el.innerHTML = html;
        featuresLoaded = true;
    } catch (e) {
        el.innerHTML = '<div class="card" style="color:#f87171;">Failed to load feature requests.</div>';
    }
}
