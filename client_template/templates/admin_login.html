<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link rel="stylesheet" href="{{ url_for('client_static', filename='css/main.css') }}">
<link rel="icon" href="{{ url_for('uploads', filename='logo.webp') }}" sizes="any">
<link rel="shortcut icon" href="{{ url_for('uploads', filename='logo.webp') }}">
<link rel="apple-touch-icon" href="{{ url_for('uploads', filename='logo.webp') }}">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: 'Inter', sans-serif;

  /* Soft premium gradient */
  background: linear-gradient(135deg, #eef3ff, #f8fafc);

  display: flex;
  align-items: center;
  justify-content: center;
}

/* Card container */
.login-card {
  width: 380px;
  padding: 2.8rem;
  border-radius: 20px;

  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(12px);

  border: 1px solid rgba(0,0,0,0.05);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08),
    0 40px 80px rgba(0,0,0,0.06);

  animation: fadeIn 0.6s ease;
}

/* Smooth entry */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Title */
.login-card h2 {
  margin-bottom: 1.8rem;
  font-size: 1.7rem;
  font-weight: 600;
  color: #1a1a1a;
}

/* Input fields */
input {
  width: 100%;
  padding: 0.85rem 0.9rem;
  margin-bottom: 1.2rem;

  border-radius: 12px;
  border: 1px solid #e2e8f0;

  font-size: 0.95rem;

  transition: all 0.25s ease;
}

input:focus {
  outline: none;
  border-color: #3b82f6;

  box-shadow:
    0 0 0 3px rgba(59,130,246,0.12),
    0 5px 15px rgba(59,130,246,0.08);
}

/* Button */
button {
  width: 100%;
  padding: 0.85rem;

  border-radius: 12px;
  border: none;

  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;

  font-weight: 600;
  font-size: 0.95rem;

  cursor: pointer;
  transition: all 0.25s ease;
}

button:hover {
  transform: translateY(-2px);

  box-shadow:
    0 10px 25px rgba(37,99,235,0.25);
}

/* Error */
.error {
  background: #fff1f1;
  color: #d92d20;

  padding: 0.65rem;
  border-radius: 10px;

  margin-bottom: 1rem;
  font-size: 0.9rem;

  border: 1px solid #ffd6d6;
}

/* Subtle footer text (optional) */
.footer {
  margin-top: 1.5rem;
  font-size: 0.8rem;
  color: #94a3b8;
  text-align: center;
}
</style>
</head>

<body>

<form class="login-card" method="POST">
  <h2>Admin Access</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="error">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <input type="password" name="password" placeholder="Enter password" required>
  <button type="submit">Login</button>

  <div class="footer">Secure admin panel</div>
</form>

</body>
</html>
